    <style>:root{--bg: #f4f7f4;--card: #ffffff;--ink: #16241c;--muted: #55645b;--line: #d5dfd8;--brand: #1f6b44;--brand-ink: #ffffff;--accent: #e8f3ec;--warn: #b3261e;--focus: #0b57d0}@media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg: #0f1713;--card: #17231c;--ink: #eaf3ed;--muted: #a9bbb0;--line: #2c3e33;--brand: #5fc08a;--brand-ink: #08130d;--accent: #1d3326;--warn: #ff8a80;--focus: #8ab4f8}}*{box-sizing:border-box}html{font-size:18px}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,Noto Sans KR,Malgun Gothic,system-ui,sans-serif;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}#app{max-width:960px;margin:0 auto;padding:0 16px 48px}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px 12px;z-index:10}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}main:focus{outline:none}.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}.brand{font-weight:800;color:var(--brand);text-decoration:none;font-size:1.05rem}nav[aria-label="주요 메뉴"]{display:flex;flex-wrap:wrap;gap:6px}nav[aria-label="주요 메뉴"] a{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card)}nav[aria-label="주요 메뉴"] a[aria-current=page]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.progress{position:relative;height:26px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-right:1px solid var(--brand);transition:width .2s}.progress em{position:relative;font-style:normal;font-size:.8rem;line-height:24px;padding-left:12px}h1{font-size:1.9rem;line-height:1.3;margin:.4rem 0 1rem}h2{font-size:1.25rem;margin:1.2rem 0 .5rem}h2:first-child{margin-top:0}h3{font-size:1.05rem;margin:1rem 0 .3rem}.eyebrow{color:var(--brand);font-weight:700;margin:1.2rem 0 0;font-size:.95rem}.lead{font-size:1.2rem}.muted,.source{color:var(--muted);font-size:.9rem}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}.hero{padding:28px 22px}.hero h1{font-size:2.2rem}.card.note{border-style:dashed;background:var(--accent)}.card.danger{border-color:var(--warn)}.tag{background:var(--accent);border:1px solid var(--brand);padding:1px 8px;border-radius:6px;font-size:.8rem}.privacy{background:var(--accent);padding:10px 14px;border-radius:10px;font-size:.95rem}.cta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}ul.plain,ol{padding-left:1.3rem;margin:.4rem 0}ol.how li,ul.plain li{margin:.35rem 0}ul.linklist,ol.linklist{list-style:none;padding:0}.linklist li,.flow li,.skill li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.linklist span,.flow span,.skill span{color:var(--muted);font-size:.9rem;text-align:right}.skill{list-style:none;padding:0}.flow{list-style:none;padding:0;margin:0}.example{background:var(--accent);border-left:4px solid var(--brand);padding:10px 14px;border-radius:6px;margin:.3rem 0}.excerpt{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:.9rem;color:var(--muted);margin:8px 0 12px}.excerpt span{display:block;font-weight:700;color:var(--ink);margin-bottom:4px}label{display:block;font-weight:700;margin:.8rem 0 .3rem}textarea{width:100%;font:inherit;font-size:1rem;padding:12px 14px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;resize:vertical;min-height:96px}.checks{list-style:none;padding:0;margin:0 0 8px}.checks label{font-weight:500;display:flex;gap:10px;align-items:flex-start;padding:10px 0;margin:0;cursor:pointer}.checks input{width:24px;height:24px;accent-color:var(--brand);flex:none;margin-top:3px}.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:6px;font:inherit;font-weight:700;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--brand);cursor:pointer;text-decoration:none;background:var(--card);color:var(--brand)}.btn.primary{background:var(--brand);color:var(--brand-ink)}.btn.warn{border-color:var(--warn);color:var(--warn)}.btn.big{min-height:56px;font-size:1.05rem;padding:12px 22px}.btn small{font-weight:400;opacity:.8}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.status{color:var(--brand);font-weight:700}.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin:20px 0}.pager .btn{flex:1 1 260px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;color:var(--muted);font-size:.9rem;padding:16px 0}.switch{display:flex;gap:8px;align-items:center;margin:0;font-weight:500}.switch input{width:20px;height:20px}@media (max-width: 600px){html{font-size:17px}h1{font-size:1.55rem}.hero h1{font-size:1.8rem}.linklist li,.flow li,.skill li{flex-direction:column;gap:2px}.linklist span,.flow span,.skill span{text-align:left}.btn{width:100%}}@media (min-width: 1100px){html{font-size:20px}}@media (prefers-reduced-motion: reduce){*{transition:none!important}}

",label:"실습 1 · 리서치"},{id:"excel",label:"실습 2 · 엑셀"},{id:"skill",label:"스킬 · 재사용 지침"},{id:"vibe",label:"바이브 코딩"}],G="보드(Padlet Drive)의 원문 프롬프트를 아래 칸에 붙여 넣고, [ ] 안의 내용을 내 업무로 바꿔 사용한다.",n=[{id:"r1",section:"research",title:"인터뷰로 내 업무와 AI 활용 환경 파악하기",minutes:15,kind:"board",source:"보드 · 실습 1 · 0_인터뷰",goal:"AI가 내 실제 업무를 질문으로 파악하고, 개인별 AI 활용 기본 지침을 만들어 주게 한다.",steps:["프롬프트 원문을 ChatGPT 또는 Gemini에 붙여 넣는다.","AI가 묻는 질문에 내가 실제로 맡은 업무 중심으로 답한다. (산림·임업 정책, 사업 기획·운영, 임업인·기업 지원 등)",'인터뷰가 끝나면 AI가 정리한 "개인별 AI 활용 기본 지침"을 복사해 아래 결과 메모에 붙여 둔다.'],prompt:{label:"0_인터뷰 프롬프트",excerpt:"역할: 한국임업진흥원 직원의 실제 업무와 생성형 AI 활용 환경을 파악하고, 인터뷰 답변을 바탕으로 개인별 AI 활용 기본 지침을 작성하는 인터뷰 진행자이자 업무 분석 전문가… (보드 썸네일에서 확인된 앞부분)"},example:'예: "저는 사업 기획팀에서 보조금 사업 공고문과 결과보고서를 주로 작성합니다."',tips:['직함보다 "하루 동안 실제로 하는 일"을 말할수록 지침이 정교해진다.',"개인정보·내부 비공개 자료는 입력하지 않는다."],checklist:["AI가 내 업무를 3가지 이상 구체적으로 되물었다","결과 지침을 복사해 두었다"],reflection:"이 지침을 매번 처음에 붙여 넣는다면, 내 업무 중 가장 먼저 시간이 줄어들 일은 무엇인가?"},{id:"r2",section:"research",title:"Deep Research로 산림·임업 통계 보고서 만들기",minutes:25,kind:"board",source:"보드 · 실습 1 · 3_Deep Research(프롬프트) / 결과물",goal:"출처가 있는 공식 자료를 근거로 정책·통계 동향 보고서 초안을 얻고, 사실과 해석을 구분해 검증한다.",steps:["ChatGPT 또는 Gemini에서 Deep Research(심층 리서치) 기능을 켠다.","프롬프트 원문을 붙여 넣어 실행한다. (산림청·한국임업진흥원 등 공식 자료 기반, 통계는 기준연도·발표일·출처 표기)","결과 보고서의 표에서 기준연도·발표일·출처가 모두 적혀 있는지 확인한다.",'근거가 불분명한 수치는 "확인 불가"로 표시하게 다시 요청한다.'],prompt:{label:"3_Deep Research 프롬프트",excerpt:"1. 산림·임업 정책과 기관별 역할 / 2. 산림·임업 현장의 주요 과제 / 3. 산림·임업 분야 디지털 전환 사례 / 4. 개인정보·보안·기록 관리 원칙 … (보드 썸네일에서 확인된 항목)"},example:'결과물 예시(보드): "산림·임업 주요 통계 동향 및 부문별 구조 변화 분석 보고서" — 지표명, 기준연도, 발표일, 작성 기관, 주요 수치, 의미를 표로 정리.',tips:["수치를 그대로 보고서에 옮기기 전에 원문 링크를 한 번은 열어 본다.",'통계표는 "지표 · 기준연도 · 출처 · 수치" 4열로 요청하면 검증이 쉽다.'],checklist:["모든 수치에 기준연도와 출처가 있다","링크 1개 이상 직접 열어 확인했다","사실과 AI의 해석을 구분했다"],reflection:"내가 AI 답변을 믿어도 되는 기준은 무엇인가? 우리 부서에 맞는 검증 규칙을 한 줄로 적어 본다."},{id:"r3",section:"research",title:"녹취록·이미지 자료를 AI에게 읽히기",minutes:15,kind:"board",source:"보드 · 실습 1 · 오디오 텍스트 파일, 인터넷 사용 언어 순위",goal:"녹취록 요약과 차트 이미지 해석으로, 텍스트가 아닌 자료도 AI에게 맡기는 방법을 익힌다.",steps:['오디오 텍스트 파일(녹취록)을 AI에 첨부하고 "핵심 논점 3개, 결정사항, 할 일"로 요약시킨다.','인터넷 사용 언어 순위 이미지를 첨부하고 "이 차트에서 읽을 수 있는 사실만" 3줄로 말하게 한다.',"두 결과를 비교해, AI가 추측한 문장이 섞여 있는지 찾아본다."],prompt:null,example:'추가 제안(프롬프트): "첨부한 자료에서 확인되는 사실과, 네가 추론한 내용을 구분해서 정리해 줘."',proposal:!0,tips:["이미지는 해상도가 낮으면 숫자를 잘못 읽는다. 읽은 숫자를 다시 말하게 해 확인한다."],checklist:["요약에서 사실과 추론이 구분되어 있다","차트 수치 중 하나를 직접 대조했다"],reflection:"내 업무에서 녹취·사진·스캔본으로 쌓여 있는 자료는 무엇인가?"},{id:"e1",section:"excel",title:"엑셀 양식 이미지를 보여 주고 표 구조 설계시키기",minutes:20,kind:"board",source:"보드 · 실습 2 · 엑셀 파일 이미지 / 4_엑셀 파일 제작(이미지 분석)",goal:"기존 엑셀 양식(행사예산 관리대장)을 캡처해 AI에 주고, 항목·함수·누락 열까지 제안받는다.",steps:['보드의 "행사예산 관리대장" 이미지(또는 내 부서 양식)를 AI에 첨부한다.',"프롬프트 원문을 붙여 넣는다. (정부형 엑셀 양식 분석 → 열 구조, 필요한 함수, 누락 열 제안)",'읽을 수 없는 항목은 AI가 임의로 만들지 않고 "판독 불가"로 표시하는지 확인한다.',"제안된 수식(예: 잔액 = 예산 − 집행)을 엑셀에 입력해 계산이 맞는지 확인한다."],prompt:{label:"4_엑셀 파일 제작(이미지 분석)",excerpt:"역할: 한국임업진흥원 업무에 활용되는 엑셀 양식 이미지 분석, 표 구조 설계, 함수 작성 전문가. 이미지에 있는 표의 항목과 구조를 파악하고 누락 칼럼을 제안한 뒤 계산·집계에 필요한 함수까지 정리 … (썸네일 확인분)"},example:"이미지 속 열: 일자 · 행사 · 내용 · 장소 · 참석인원 · 예산 · 집행 · 잔액 · 요청담당자",tips:["캡처에 개인정보나 내부 금액이 있으면 가려서 올린다."],checklist:["AI가 열 이름을 정확히 읽었다","제안 수식을 엑셀에서 직접 실행해 봤다"],reflection:"우리 부서에서 매달 손으로 다시 만드는 표는 무엇인가?"},{id:"e2",section:"excel",title:"VBA로 직원 주소록 자동 생성하기",minutes:20,kind:"board",source:"보드 · 실습 2 · 주소록 VBA / 5_VBA코드(주소록)",goal:"코드를 이해하지 않아도, 복사 → 실행 → 결과 확인 순서로 VBA 매크로를 돌려 본다.",steps:["엑셀에서 Alt+F11(Mac은 Option+F11)로 VBA 편집기를 연다.","삽입 → 모듈을 만들고 보드의 5_VBA코드(주소록)를 붙여 넣는다.",'매크로 "직원주소록_생성"을 실행해 시트 "직원주소록"과 표 "tblEmployeeDirectory"가 만들어지는지 확인한다.',"오류가 나면 오류 메시지를 그대로 AI에게 붙여 넣어 수정 코드를 받는다."],prompt:{label:"5_VBA코드(주소록)",excerpt:'Option Explicit / SHEET_NAME = "직원주소록", TABLE_NAME = "tblEmployeeDirectory" / Public Sub 직원주소록_생성() … (썸네일 확인분)'},example:'추가 제안(오류 요청문): "아래 VBA를 실행하니 이 오류가 나. 원인과 수정된 전체 코드를 줘: [오류 메시지]"',tips:["파일은 반드시 .xlsm(매크로 사용 통합 문서)으로 저장한다.","원본 파일은 복사본을 만들어 실습한다."],checklist:["매크로가 오류 없이 실행되었다","결과 시트를 확인했다"],reflection:"코드를 몰라도 실행할 수 있다는 것이 업무 자동화에 어떤 변화를 주는가?"},{id:"e3",section:"excel",title:"가상 데이터로 현황표·인사이트·대시보드 만들기",minutes:25,kind:"board",source:"보드 · 실습 2 · 6_데이터 분석 가상데이터 / 6_데이터 분석 VBA",goal:"접수현황 원본 데이터에서 유형×상태 현황표, 인사이트, KPI 카드와 차트 대시보드를 한 번에 만든다.",steps:['보드의 6_데이터 분석 가상데이터를 엑셀 시트 "접수현황"에 넣는다. (아래 샘플 CSV로 대체 가능)',"6_데이터 분석 VBA를 모듈에 붙여 넣고 실행한다.",'"현황표", "인사이트", "대시보드" 3개 시트가 생기는지 확인한다. 원본 시트는 수정하지 않는다.',"인사이트 시트의 문장 하나를 골라, 숫자가 현황표와 일치하는지 대조한다."],prompt:{label:"6_데이터 분석 VBA",excerpt:'접수 데이터 분석 도구(표준 모듈 1개) — 1) 현황표_생성: 유형×상태 집계표 2) 인사이트_생성: 사실 수치 위주(해석 없이) 3) 대시보드_생성: KPI 카드 4개 + 차트 3개. 원본 "접수현황" 시트는 읽기만 하고 수정하지 않는다. (썸네일 확인분)'},sample:"receipts",example:"샘플 열: 접수번호 · 접수일 · 접수경로 · 유형 · 우선순위 · 담당부서 · 상태",tips:["VBA는 열 위치가 아니라 머리글 이름으로 찾는다. 머리글 이름을 바꾸면 동작하지 않는다."],checklist:["3개 시트가 생성되었다","인사이트 숫자 1개를 직접 검산했다"],reflection:"같은 데이터를 매달 받는 업무가 있다면, 이 도구를 어디에 재사용할 수 있는가?"},{id:"e4",section:"excel",title:"분석 결과를 부서별 시트로 자동 분리하기",minutes:15,kind:"board",source:"보드 · 실습 2 · 7_부서별 시트 분리 VBA코드(6번 파일 사용)",goal:"한 장의 데이터를 담당부서별 시트로 나누어 배포용 파일을 만든다.",steps:["6번 파일(접수현황)이 열려 있는 상태에서 새 모듈에 7번 VBA를 붙여 넣는다.",'매크로 "KFI_담당부서별시트분리"를 실행한다.','"부서별_분리결과" 시트와 부서별 시트가 생성되었는지 확인한다.'],prompt:{label:"7_부서별 시트 분리 VBA",excerpt:'KFI_SRC_SHEET = "접수현황", KFI_DEPT_HEADER = "담당부서", KFI_DONE_STATUS = "완료", 시트 이름 최대 31자 … (썸네일 확인분)'},sample:"receipts",example:"기준 열: 담당부서 / 시트 이름 제한: 31자",tips:["시트 이름에는 / \\ ? * [ ] : 를 쓸 수 없다. 코드가 이를 처리하는지 확인한다."],checklist:["부서 수만큼 시트가 만들어졌다","한 부서의 행 수가 원본과 일치한다"],reflection:"이 방식으로 배포 시간을 줄일 수 있는 우리 부서 업무는?"},{id:"s1",section:"skill",title:"반복 업무를 지침(스킬)으로 만들어 재사용하기",minutes:25,kind:"board",source:"보드 · 스킬 (회의록 정리 / 문제해결 / 라이프·비즈니스 코치 / 스킬 제작 스킬 / 보고서 초안 / 사업계획서 구조화)",goal:'한 번 만든 지침을 계속 불러 쓰는 방식으로, "매번 새로 설명하는 일"을 없앤다.',steps:["아래 6종 중 내 업무에 가장 가까운 지침 1개를 고른다.","해당 지침 원문을 ChatGPT(맞춤 지침/GPTs)나 Gemini(Gems)에 등록한다.","내 실제 자료(메모, 회의 내용 등)를 주고 결과를 받는다.",'결과가 아쉬운 부분을 "스킬 제작 스킬"에게 말해 지침을 고친다.'],skills:[{name:"회의록 정리",note:"논의·결정·할 일·담당자 구분, 확정되지 않은 내용은 별도 표시"},{name:"문제해결 코치",note:"조직 문제해결 전략가 ·
